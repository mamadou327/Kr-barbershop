<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#efe9df;font-family:Helvetica,Arial,sans-serif;color:#2a2622}
.wrap{width:2400px;padding:60px 70px;box-sizing:border-box}
h1{font-weight:300;letter-spacing:.35em;font-size:40px;margin:0 0 6px}
.sub{letter-spacing:.2em;font-size:15px;color:#7a7066;margin-bottom:40px}
.row{display:flex;gap:70px;align-items:flex-start}
.panel h2{font-weight:400;letter-spacing:.3em;font-size:18px;margin:0 0 14px}
svg text{font-family:Helvetica,Arial,sans-serif}
.lab{font-size:15px;letter-spacing:.12em;fill:#2a2622}
.sm{font-size:12px;letter-spacing:.08em;fill:#7a7066}
.legend{margin-top:36px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 40px;font-size:16px}
.legend b{display:inline-block;width:26px;height:26px;border-radius:50%;background:#b0532c;color:#fff;text-align:center;line-height:26px;font-size:14px;margin-right:10px}
</style></head><body><div class="wrap">
<h1>CASA OMBRA</h1>
<div class="sub">GENERAL ARRANGEMENT · 1:200 · FORECOURT TO THE WEST · NUMBERED MARKERS = CAMERA POSITIONS FOR EACH INTERIOR SHOT</div>
<div class="row" id="row"></div>
<div class="legend" id="legend"></div>
</div>
<script>
const S=22; // px per metre
const W='#2a2622';
function svg(w,h,body){return `<svg width="${w*S+40}" height="${h*S+40}" viewBox="-20 -20 ${w*S+40} ${h*S+40}">${body}</svg>`}
const r=(x,y,w,h,o={})=>`<rect x="${x*S}" y="${y*S}" width="${w*S}" height="${h*S}" fill="${o.f||'none'}" stroke="${o.s||W}" stroke-width="${o.sw??1.2}" ${o.d?`stroke-dasharray="${o.d}"`:''}/>`;
const wall=(x1,y1,x2,y2,t=5)=>`<line x1="${x1*S}" y1="${y1*S}" x2="${x2*S}" y2="${y2*S}" stroke="${W}" stroke-width="${t}" stroke-linecap="square"/>`;
const glass=(x1,y1,x2,y2)=>`<line x1="${x1*S}" y1="${y1*S}" x2="${x2*S}" y2="${y2*S}" stroke="#5f8aa0" stroke-width="3"/><line x1="${x1*S}" y1="${y1*S}" x2="${x2*S}" y2="${y2*S}" stroke="#efe9df" stroke-width="1"/>`;
const t=(x,y,s,c='lab')=>`<text x="${x*S}" y="${y*S}" class="${c}" text-anchor="middle">${s}</text>`;
const stair=(x,y,w,n,len)=>{let o=r(x,y,w,len,{f:'#e4dccf'});for(let i=1;i<n;i++)o+=`<line x1="${x*S}" y1="${(y+len*i/n)*S}" x2="${(x+w)*S}" y2="${(y+len*i/n)*S}" stroke="${W}" stroke-width=".8"/>`;return o};
const tree=(x,y,rad=1.3)=>`<circle cx="${x*S}" cy="${y*S}" r="${rad*S}" fill="#c9cfae" stroke="#7d8656"/><circle cx="${x*S}" cy="${y*S}" r="3" fill="#7d8656"/>`;
const car=(x,y,c,l)=>`<rect x="${x*S}" y="${y*S}" width="${2*S}" height="${4.6*S}" rx="8" fill="${c}" opacity=".85"/>${t(x+1,y+5.3,l,'sm')}`;
const cam=(n,x,y,ang)=>{const a=ang*Math.PI/180,L=3.2*S,sp=.42;const p=(d)=>`${x*S+L*Math.cos(a+d)},${y*S+L*Math.sin(a+d)}`;
 return `<polygon points="${x*S},${y*S} ${p(-sp)} ${p(sp)}" fill="#b0532c" opacity=".18"/><circle cx="${x*S}" cy="${y*S}" r="13" fill="#b0532c"/><text x="${x*S}" y="${y*S+5}" fill="#fff" font-size="14" text-anchor="middle">${n}</text>`};
const north=(x,y)=>`<g transform="translate(${x*S},${y*S})"><polygon points="0,-26 9,6 0,0 -9,6" fill="${W}"/><text y="26" text-anchor="middle" class="sm">N</text></g>`;


/* Coordinates in metres, north up. Forecourt to the WEST. Box long axis runs east.
   Master-4 camera stands south-west of the forecourt looking north-east at the corner. */
const OX=12, OY=10; const X=v=>v+OX, Y=v=>v+OY;
const R=(x,y,w,h,o)=>r(X(x),Y(y),w,h,o), Wl=(a,b,c,d,t)=>wall(X(a),Y(b),X(c),Y(d),t), G=(a,b,c,d)=>glass(X(a),Y(b),X(c),Y(d)),
      T=(x,y,s,c)=>t(X(x),Y(y),s,c), TR=(x,y,rad)=>tree(X(x),Y(y),rad), C=(n,x,y,a)=>cam(n,X(x),Y(y),a),
      ST=(x,y,w,n,l)=>stair(X(x),Y(y),w,n,l);
const carH=(x,y,c,l)=>`<rect x="${X(x)*S}" y="${Y(y)*S}" width="${4.6*S}" height="${2*S}" rx="8" fill="${c}" opacity=".85"/>`;
let g='';
// forecourt (west)
g+=R(-11,-7,19,31,{f:'#e6ddcf',s:'#b9ad9c',sw:.8})+T(-6,-3,'TRAVERTINE','sm')+T(-6,-2.2,'FORECOURT','sm');
g+=carH(1.5,2.5,'#8c8c88')+T(3.8,1.9,'M3 CS','sm')+carH(1.5,9.2,'#1d1d1d')+T(3.8,12.4,'MANSORY URUS','sm');
// garage wing (low travertine volume running north from the box end)
g+=R(8,-8,11,14,{f:'#f3eee6',s:'none'})+Wl(8,-8,19,-8)+Wl(19,-8,19,6)+G(8,-8,8,3)+Wl(8,3,8,6);
g+=`<rect x="${X(10)*S}" y="${Y(-6)*S}" width="${4.6*S}" height="${2*S}" rx="8" fill="#8fc23a" opacity=".85"/>`+T(12.3,-6.4,'SVJ','sm');
g+=`<rect x="${X(11)*S}" y="${Y(-1.5)*S}" width="${4.6*S}" height="${2*S}" rx="8" fill="#c4251b" opacity=".85"/>`+T(13.3,-1.9,'SF90','sm');
g+=T(15,2.8,'GLASS GARAGE')+T(15,3.6,'glass face to forecourt','sm');
// ground floor under the box
g+=R(8,6,26,10,{f:'#fbf8f3',s:'none'})+Wl(8,6,34,6)+G(8,6,19,6)+Wl(8,6,8,16)+G(14,16,34,16)+Wl(8,16,11,16);
// entrance hall x8..14
g+=Wl(14,6,14,11,2.5)+R(9,7,3.4,3.4,{f:'#ddd5c6',d:'5 4'})+TR(10.7,8.7,1.4)+T(10.7,11.2,'OLIVE · SKYLIGHT','sm');
g+=ST(12.3,7,1.6,12,8.4)+T(11,13.2,'ENTRANCE')+T(11,14,'STAIR HALL','lab');
g+=`<line x1="${X(11.2)*S}" y1="${Y(16)*S}" x2="${X(13.4)*S}" y2="${Y(16)*S}" stroke="#6b4a2b" stroke-width="6"/>`+T(12.3,17.2,'PIVOT DOOR','sm');
g+=T(13.2,5.4,'glass wall to garage','sm');
// living / dining / kitchen
g+=R(15.5,12,6,2.2,{f:'#e7dfd2'})+R(19,9.5,2.4,1,{f:'#e7dfd2'})+T(19.5,8.2,'LIVING')+T(19.5,9,'glass to pool','sm');
g+=R(24.5,11.5,4.2,1.4,{f:'#d9cfbf'})+T(26.6,10.8,'DINING');
g+=R(28.8,6.6,4.6,1,{f:'#cfc5b5'})+R(29.3,9,3.8,1.3,{f:'#b8ad9b'})+T(31.2,12.4,'KITCHEN','sm');
// east: cantilever over terrace + plunge
g+=R(34,6,8,10,{f:'#efe7da',s:'#b9ad9c',d:'4 4'})+G(34,6,34,16);
g+=R(36,7,4.5,5,{f:'#9fc3cc',s:'#6f949e'})+T(38.2,9.8,'PLUNGE','sm')+T(38,14.6,'TERRACE','sm');
// lit platform at corner, reflecting pool along south face
g+=R(8,16,6,3.5,{f:'#efe2c4',s:'#c9a25a'})+T(11,18.7,'LIT PLATFORM','sm');
g+=R(14,16,23,5,{f:'#bccdd3',s:'#7e9aa4'})+T(20,19,'REFLECTING POOL','sm');
g+=R(25.5,16.8,3.6,3,{f:'#d8cfbf'})+TR(27.3,18.3,1.5)+TR(33.5,17.6,1.3);
// terraced garden + steps south-east
g+=R(14,21,32,5,{f:'#e3e2cf',s:'#b9ad9c',sw:.8})+ST(36,21,6,5,4.5)+T(39,26.8,'STEPS','sm')+T(26,24,'TERRACED GARDEN','sm');
// garden north
g+=R(19,-8,27,14,{f:'#e3e2cf',s:'#b9ad9c',sw:.8})+T(32,-1,'OLIVE GARDEN','sm')+TR(24,-4,1.3)+TR(30,-5,1.2)+TR(38,-3,1.4);
// first-floor box outline
g+=R(6.5,5.5,35.5,11,{s:'#b0532c',sw:1,d:'8 6'})+T(30,5,'FIRST-FLOOR BOX ABOVE · LATTICE ON WEST END + SOUTH FACE','sm');
// master 4 camera
g+=`<g>${cam('M',X(-10),Y(23),-38)}</g>`+T(-6.5,25.6,'MASTER 4 VIEW','sm');
// interior cameras
g+=C(1,12.3,15.2,-115);  // hall: just inside door looking north-west, garage glass ahead-left
g+=C(2,32,15,-165);      // living looking west along the glass
g+=C(3,22,13.5,-20);     // kitchen
g+=C(9,13,7.2,-110);     // garage through glass from hall
g+=north(X(-9.5)-0,Y(-7));

let f='';
f+=R(6.5,5.5,35.5,11,{f:'#fbf8f3',s:'none'})+Wl(6.5,5.5,42,5.5)+Wl(42,5.5,42,16.5);
f+=`<line x1="${X(6.5)*S}" y1="${Y(16.5)*S}" x2="${X(42)*S}" y2="${Y(16.5)*S}" stroke="#8a6a46" stroke-width="7" stroke-dasharray="3 3"/>`;
f+=`<line x1="${X(6.5)*S}" y1="${Y(5.5)*S}" x2="${X(6.5)*S}" y2="${Y(16.5)*S}" stroke="#8a6a46" stroke-width="7" stroke-dasharray="3 3"/>`;
f+=R(6.5,14.5,35.5,2,{f:'#f1eadf',s:'none'})+T(24,15.8,'LATTICE GALLERY','sm');
f+=R(9,7,3.4,3.4,{f:'#ddd5c6',d:'5 4'})+TR(10.7,8.7,1.4)+ST(12.3,9,1.6,6,5)+T(10.5,12.5,'void','sm');
f+=Wl(14.5,5.5,14.5,14.5,2.5)+Wl(21.5,5.5,21.5,14.5,2.5)+Wl(28.5,5.5,28.5,14.5,2.5)+Wl(14.5,14.5,42,14.5,2.5);
f+=T(18,10,'BEDROOM 2')+T(25,10,'BEDROOM 3')+T(36,11.5,'PRIMARY SUITE');
f+=R(29,6,4.5,2.8,{f:'#dfe8ea',s:'#7e9aa4'})+T(31.2,7.7,'BATH','sm')+R(37,7,3.4,3.8,{f:'#e7dfd2'});
f+=`<line x1="${X(34)*S}" y1="${Y(4.5)*S}" x2="${X(34)*S}" y2="${Y(17.5)*S}" stroke="#b0532c" stroke-dasharray="6 5"/>`+T(38,4.9,'CANTILEVER','sm');
f+=C(4,33,12,-15)+C(5,30,9.5,-60)+C(6,40,15.4,180);
const firstSvg=`<g transform="translate(${-(OX+5.5)*S},${-(OY+4)*S})">${f}</g>`;

let l='';
l+=R(8,6,26,10,{f:'#fbf8f3',s:'none'})+Wl(8,6,34,6)+Wl(8,16,34,16)+Wl(8,6,8,16)+Wl(34,6,34,16);
l+=ST(12.3,7,1.6,8,5)+Wl(14.5,6,14.5,16,2.5)+Wl(24,6,24,16,2.5);
l+=R(16,11,6.6,1.2,{f:'#3a3531'})+R(16,13.2,6.6,1.2,{f:'#3a3531'})+R(16.2,6.6,6.2,.3,{f:'#2a2622'})+T(19.3,9.4,'CINEMA');
l+=R(24.6,6.6,9,1,{f:'#7a5a3e'})+T(29,10,'WINE GALLERY')+T(10.5,14,'GYM','sm');
l+=C(7,19.3,15.3,-90)+C(8,29,15.2,-90);
const lowSvg=`<g transform="translate(${-(OX+7)*S},${-(OY+5)*S})">${l}</g>`;
document.getElementById('row').innerHTML=
 `<div class="panel"><h2>GROUND FLOOR</h2>${svg(58,38,g)}</div>`+
 `<div class="panel"><h2>FIRST FLOOR</h2>${svg(37,13,firstSvg)}<h2 style="margin-top:40px">LOWER GROUND</h2>${svg(28,12,lowSvg)}</div>`;
const L=[['1','Entrance stair hall'],['2','Living, looking to pool'],['3','Kitchen & dining'],['4','Primary suite, cantilever glass'],['5','Primary bath'],['6','Lattice gallery'],['7','Cinema'],['8','Wine gallery'],['9','Garage seen from the hall'],['M','Master 4 exterior view']];
document.getElementById('legend').innerHTML=L.map(([n,s])=>`<div><b>${n}</b>${s}</div>`).join('');
</script></body></html>
