<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#efe9df;font-family:Helvetica,Arial,sans-serif;color:#2a2622}
.wrap{width:2400px;padding:60px 70px;box-sizing:border-box}
h1{font-weight:300;letter-spacing:.35em;font-size:40px;margin:0 0 6px}
.sub{letter-spacing:.2em;font-size:15px;color:#7a7066;margin-bottom:40px}
.row{display:flex;gap:70px;align-items:flex-start}
.panel h2{font-weight:400;letter-spacing:.3em;font-size:18px;margin:0 0 14px}
svg text{font-family:Helvetica,Arial,sans-serif}
.lab{font-size:15px;letter-spacing:.12em;fill:#2a2622}
.sm{font-size:12px;letter-spacing:.08em;fill:#7a7066}
.legend{margin-top:36px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 40px;font-size:16px}
.legend b{display:inline-block;width:26px;height:26px;border-radius:50%;background:#b0532c;color:#fff;text-align:center;line-height:26px;font-size:14px;margin-right:10px}
</style></head><body><div class="wrap">
<h1>CASA OMBRA</h1>
<div class="sub">GENERAL ARRANGEMENT · 1:200 · DRAWN FROM MASTER 4 + AERIAL ANGLES · NUMBERED MARKERS = CAMERA POSITIONS FOR EACH INTERIOR SHOT</div>
<div class="row" id="row"></div>
<div class="legend" id="legend"></div>
</div>
<script>
const S=22; // px per metre
const W='#2a2622';
function svg(w,h,body){return `<svg width="${w*S+40}" height="${h*S+40}" viewBox="-20 -20 ${w*S+40} ${h*S+40}">${body}</svg>`}
const r=(x,y,w,h,o={})=>`<rect x="${x*S}" y="${y*S}" width="${w*S}" height="${h*S}" fill="${o.f||'none'}" stroke="${o.s||W}" stroke-width="${o.sw??1.2}" ${o.d?`stroke-dasharray="${o.d}"`:''}/>`;
const wall=(x1,y1,x2,y2,t=5)=>`<line x1="${x1*S}" y1="${y1*S}" x2="${x2*S}" y2="${y2*S}" stroke="${W}" stroke-width="${t}" stroke-linecap="square"/>`;
const glass=(x1,y1,x2,y2)=>`<line x1="${x1*S}" y1="${y1*S}" x2="${x2*S}" y2="${y2*S}" stroke="#5f8aa0" stroke-width="3"/><line x1="${x1*S}" y1="${y1*S}" x2="${x2*S}" y2="${y2*S}" stroke="#efe9df" stroke-width="1"/>`;
const t=(x,y,s,c='lab')=>`<text x="${x*S}" y="${y*S}" class="${c}" text-anchor="middle">${s}</text>`;
const stair=(x,y,w,n,len)=>{let o=r(x,y,w,len,{f:'#e4dccf'});for(let i=1;i<n;i++)o+=`<line x1="${x*S}" y1="${(y+len*i/n)*S}" x2="${(x+w)*S}" y2="${(y+len*i/n)*S}" stroke="${W}" stroke-width=".8"/>`;return o};
const tree=(x,y,rad=1.3)=>`<circle cx="${x*S}" cy="${y*S}" r="${rad*S}" fill="#c9cfae" stroke="#7d8656"/><circle cx="${x*S}" cy="${y*S}" r="3" fill="#7d8656"/>`;
const car=(x,y,c,l)=>`<rect x="${x*S}" y="${y*S}" width="${2*S}" height="${4.6*S}" rx="8" fill="${c}" opacity=".85"/>${t(x+1,y+5.3,l,'sm')}`;
const cam=(n,x,y,ang)=>{const a=ang*Math.PI/180,L=3.2*S,sp=.42;const p=(d)=>`${x*S+L*Math.cos(a+d)},${y*S+L*Math.sin(a+d)}`;
 return `<polygon points="${x*S},${y*S} ${p(-sp)} ${p(sp)}" fill="#b0532c" opacity=".18"/><circle cx="${x*S}" cy="${y*S}" r="13" fill="#b0532c"/><text x="${x*S}" y="${y*S+5}" fill="#fff" font-size="14" text-anchor="middle">${n}</text>`};
const north=(x,y)=>`<g transform="translate(${x*S},${y*S})"><polygon points="0,-26 9,6 0,0 -9,6" fill="${W}"/><text y="26" text-anchor="middle" class="sm">N</text></g>`;



/* Read from master 4 + aerial angles. North up. The long lattice face of the box looks SOUTH over the
   reflecting pool to the landscaped strip and the road. Garage wing at the WEST end, projecting south
   towards the forecourt. Low spa wing at the EAST end. Lit steps rise from the forecourt onto the
   covered terrace between garage and pool; the front door is at the top of those steps. */
const OX=8, OY=12; const X=v=>v+OX, Y=v=>v+OY;
const R=(x,y,w,h,o)=>r(X(x),Y(y),w,h,o), Wl=(a,b,c,d,t)=>wall(X(a),Y(b),X(c),Y(d),t), G=(a,b,c,d)=>glass(X(a),Y(b),X(c),Y(d)),
      T=(x,y,s,c)=>t(X(x),Y(y),s,c), TR=(x,y,rad)=>tree(X(x),Y(y),rad), C=(n,x,y,a)=>cam(n,X(x),Y(y),a),
      ST=(x,y,w,n,l)=>stair(X(x),Y(y),w,n,l);
const carV=(x,y,c)=>`<rect x="${X(x)*S}" y="${Y(y)*S}" width="${2*S}" height="${4.6*S}" rx="8" fill="${c}" opacity=".9"/>`;
let g='';
// north garden
g+=R(-6,-11,58,10,{f:'#e3e2cf',s:'#b9ad9c',sw:.8})+T(26,-6,'OLIVE GARDEN · REAR','sm')+TR(4,-6,1.4)+TR(16,-8,1.2)+TR(38,-7,1.3)+TR(47,-5,1.2);
// road along south
g+=R(-6,27,58,3.5,{f:'#cfcac2',s:'none'})+T(26,29.2,'ROAD','sm');
g+=Wl(-6,26.6,-1,26.6,3)+Wl(17,26.6,52,26.6,3);
// forecourt (south-west, open to road)
g+=R(-4,14,21,12.6,{f:'#e6ddcf',s:'#b9ad9c',sw:.8})+T(1.5,24.6,'TRAVERTINE FORECOURT','sm');
g+=carV(6.2,17.2,'#8c8c88')+T(7.2,23,'M3 CS','sm')+carV(10,16.4,'#1d1d1d')+T(11,22.2,'URUS','sm');
g+=TR(-2,21,1.6)+TR(1,24,1.4);
// GARAGE WING x0..13 y-1..14  (glass face south to forecourt)
g+=R(0,-1,13,15,{f:'#f3eee6',s:'none'})+Wl(0,-1,13,-1)+Wl(0,-1,0,14)+Wl(0,14,1,14)+G(1,14,11,14)+Wl(11,14,13,14)+Wl(13,9,13,14);
g+=carV(3,6,'#8fc23a')+T(4,12.2,'SVJ','sm')+carV(7.5,5,'#c4251b')+T(8.5,11.2,'SF90','sm');
g+=T(6.5,1.6,'GLASS GARAGE')+T(6.5,2.4,'glass face to forecourt','sm');
// glass wall garage -> hall
g+=G(13,-1,13,9);
// GROUND FLOOR under box: enclosure x13..42 y-1..9, terrace y9..11 under overhang
g+=R(13,-1,29,10,{f:'#fbf8f3',s:'none'})+Wl(13,-1,42,-1)+G(13,9,42,9)+Wl(42,-1,42,9);
g+=R(13,9,29,2,{f:'#efe2c4',s:'none'})+T(30,10.4,'COVERED TERRACE UNDER THE BOX','sm');
// entrance hall x13..19
g+=Wl(19,-1,19,5,2.5)+R(14,0,3.4,3.4,{f:'#ddd5c6',d:'5 4'})+TR(15.7,1.7,1.4)+T(15.7,4.4,'OLIVE · SKYLIGHT','sm');
g+=ST(17.4,1,1.5,10,7)+T(16,6.4,'ENTRANCE HALL')+T(16,7.2,'double height','sm');
g+=`<line x1="${X(13.6)*S}" y1="${Y(9)*S}" x2="${X(16.4)*S}" y2="${Y(9)*S}" stroke="#6b4a2b" stroke-width="7"/>`;
// lit steps from forecourt up to terrace
g+=ST(13.2,11,3.2,5,4)+T(14.8,16,'LIT STEPS UP','sm')+T(15,12.8,'','sm');
// living / dining / kitchen
g+=R(21,4.5,6,2.2,{f:'#e7dfd2'})+R(24,1.5,2.4,1,{f:'#e7dfd2'})+R(20,1,.5,3,{f:'#8a7f72'})+T(25,0.6,'LIVING');
g+=R(30,4,4.6,1.4,{f:'#d9cfbf'})+T(32.3,3.3,'DINING');
g+=R(36.5,0,4.8,1,{f:'#cfc5b5'})+R(37,3.6,3.6,1.3,{f:'#b8ad9b'})+T(38.8,7.2,'KITCHEN');
// reflecting pool (south of terrace, wraps to forecourt edge)
g+=R(16.4,11,27.6,6,{f:'#2f3236',s:'#c9a25a'})+T(23,16.2,'BLACK REFLECTING POOL','sm').replace('class="sm"','class="sm" style="fill:#d9d2c6"');
g+=R(21,12.4,3.6,3,{f:'#4a4a48',s:'#c9a25a'})+TR(22.8,13.9,1.6)+R(32,11.8,3.4,2.8,{f:'#4a4a48',s:'#c9a25a'})+TR(33.7,13.2,1.5);
// landscaped strip + steps down to road
g+=R(17,17,35,9.6,{f:'#e3e2cf',s:'#b9ad9c',sw:.8})+ST(30,17.2,3,6,7)+T(31.5,25.6,'GARDEN STEPS','sm')+TR(26,20,1.6)+TR(41,21,1.6)+TR(47,19,1.4)+T(22,23,'LANDSCAPED TERRACES','sm');
// east spa wing x42..50 y-2..8
g+=R(42,-2,8,10,{f:'#f3eee6',s:'none'})+Wl(42,-2,50,-2)+Wl(50,-2,50,8)+Wl(42,8,44.5,8)+Wl(46.5,8,50,8);
g+=R(43.2,-1,5,4,{f:'#9fc3cc',s:'#6f949e'})+T(46,4.6,'SPA WING')+T(46,5.4,'plunge pool · sauna','sm');
// first-floor box outline: x10..46 y-2..11 (overhangs west over garage junction and terrace)
g+=R(10,-2,36,13,{s:'#b0532c',sw:1,d:'8 6'})+T(28,-2.6,'FIRST-FLOOR BOX ABOVE (LATTICE ON SOUTH FACE + WEST END)','sm');
// cameras
g+=cam('M',X(-5),Y(26),-40)+T(-4,27.8,'MASTER 4','sm');
g+=C(1,15,8.2,-100);    // hall from front door: olive + stair ahead, garage glass left
g+=C(9,17,3.5,180);     // garage through the glass wall
g+=C(2,28,8.2,-160);    // living looking west
g+=C(3,33,7.6,-20);     // kitchen
g+=north(X(-4.5),Y(-9));

let f='';
f+=R(10,-2,36,13,{f:'#fbf8f3',s:'none'})+Wl(10,-2,46,-2)+Wl(46,-2,46,11);
f+=`<line x1="${X(10)*S}" y1="${Y(11)*S}" x2="${X(46)*S}" y2="${Y(11)*S}" stroke="#8a6a46" stroke-width="7" stroke-dasharray="3 3"/>`;
f+=`<line x1="${X(10)*S}" y1="${Y(-2)*S}" x2="${X(10)*S}" y2="${Y(11)*S}" stroke="#8a6a46" stroke-width="7" stroke-dasharray="3 3"/>`;
f+=R(10,9,36,2,{f:'#f1eadf',s:'none'})+T(30,10.4,'LATTICE GALLERY','sm');
f+=Wl(21,-2,21,9,2.5)+Wl(28,-2,28,9,2.5)+Wl(35,-2,35,9,2.5)+Wl(21,9,46,9,2.5);
f+=R(14,0,3.4,3.4,{f:'#ddd5c6',d:'5 4'})+TR(15.7,1.7,1.4)+ST(17.4,3,1.5,6,5)+T(15.6,5.4,'void','sm');
f+=R(10.6,-1.4,4.5,2.6,{f:'#dfe8ea',s:'#7e9aa4'})+T(13,0.2,'BATH','sm');
f+=R(11,4,3.4,3.6,{f:'#e7dfd2'})+T(15.5,8.2,'PRIMARY SUITE','lab');
f+=T(24.5,4,'BEDROOM 2')+T(31.5,4,'BEDROOM 3')+T(40.5,4,'BEDROOM 4');
f+=C(4,19,6.2,180)+C(5,15.5,0.6,170)+C(6,44,10,180);
const firstSvg=`<g transform="translate(${-(OX+9.5)*S},${-(OY-2.5)*S})">${f}</g>`;

let l='';
l+=R(13,-1,29,10,{f:'#fbf8f3',s:'none'})+Wl(13,-1,42,-1)+Wl(13,9,42,9)+Wl(13,-1,13,9)+Wl(42,-1,42,9);
l+=ST(17.4,1,1.5,8,5)+Wl(20,-1,20,9,2.5)+Wl(31,-1,31,9,2.5);
l+=R(22,4,7,1.1,{f:'#3a3531'})+R(22,6,7,1.1,{f:'#3a3531'})+R(22,-.4,7,.3,{f:'#2a2622'})+T(25.5,2.4,'CINEMA');
l+=R(32,-.4,9,1,{f:'#7a5a3e'})+T(36.5,3,'WINE GALLERY')+T(15.5,7.4,'GYM','sm');
l+=C(7,25.5,8.2,-90)+C(8,36.5,8.2,-90);
const lowSvg=`<g transform="translate(${-(OX+12.5)*S},${-(OY-1.5)*S})">${l}</g>`;
document.getElementById('row').innerHTML=
 `<div class="panel"><h2>GROUND FLOOR</h2>${svg(59,43,g)}</div>`+
 `<div class="panel"><h2>FIRST FLOOR</h2>${svg(37,14,firstSvg)}<h2 style="margin-top:40px">LOWER GROUND</h2>${svg(30,11,lowSvg)}</div>`;
const L=[['1','Entrance stair hall'],['2','Living, looking to pool'],['3','Kitchen & dining'],['4','Primary suite, cantilever glass'],['5','Primary bath'],['6','Lattice gallery'],['7','Cinema'],['8','Wine gallery'],['9','Garage seen from the hall'],['M','Master 4 exterior view']];
document.getElementById('legend').innerHTML=L.map(([n,s])=>`<div><b>${n}</b>${s}</div>`).join('');
</script></body></html>
