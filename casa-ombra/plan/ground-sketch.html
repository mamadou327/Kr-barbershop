<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif}
.wrap{width:2400px;height:1350px;position:relative}
svg text{font-family:Helvetica,Arial,sans-serif;fill:#111}
</style></head><body><div class="wrap"><svg id="s" width="2400" height="1350"></svg></div>
<script>
const S=36, OX=150, OY=230;            // 38 px per metre
const X=v=>OX+v*S, Y=v=>OY+v*S;
let o='';
const line=(a,b,c,d,w=2,col='#111',dash='')=>o+=`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="square"/>`;
const wall=(a,b,c,d)=>line(a,b,c,d,9);
const iwall=(a,b,c,d)=>line(a,b,c,d,5);
const glass=(a,b,c,d)=>{line(a,b,c,d,7,'#111');line(a,b,c,d,3,'#fff');};
const rect=(x,y,w,h,f='none',st='#111',sw=1.5,dash='')=>o+=`<rect x="${X(x)}" y="${Y(y)}" width="${w*S}" height="${h*S}" fill="${f}" stroke="${st}" stroke-width="${sw}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
const txt=(x,y,s,size=26,w=600,col='#111',ls='.14em')=>o+=`<text x="${X(x)}" y="${Y(y)}" font-size="${size}" font-weight="${w}" letter-spacing="${ls}" fill="${col}" text-anchor="middle">${s}</text>`;
const door=(hx,hy,len,dir)=>{ // hinge point, leaf length, dir: 'up','down' swing for door in horizontal wall opening to the right
  const sgn=dir==='up'?-1:1;
  o+=`<line x1="${X(hx)}" y1="${Y(hy)}" x2="${X(hx)}" y2="${Y(hy+sgn*len)}" stroke="#111" stroke-width="2"/>`;
  o+=`<path d="M${X(hx)} ${Y(hy+sgn*len)} A ${len*S} ${len*S} 0 0 ${dir==='up'?1:0} ${X(hx+len)} ${Y(hy)}" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>`;
};
const doorV=(hx,hy,len,dir)=>{ // door in vertical wall, hinge at (hx,hy), opening downward along wall, swing left/right
  const sgn=dir==='left'?-1:1;
  o+=`<line x1="${X(hx)}" y1="${Y(hy)}" x2="${X(hx+sgn*len)}" y2="${Y(hy)}" stroke="#111" stroke-width="2"/>`;
  o+=`<path d="M${X(hx+sgn*len)} ${Y(hy)} A ${len*S} ${len*S} 0 0 ${dir==='left'?0:1} ${X(hx)} ${Y(hy+len)}" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>`;
};
const stair=(x,y,w,l,n,horiz)=>{rect(x,y,w,l,'#fff');for(let i=1;i<n;i++){ if(horiz){const xx=x+w*i/n;line(xx,y,xx,y+l,1.2);} else {const yy=y+l*i/n;line(x,yy,x+w,yy,1.2);} }};
const arrow=(x1,y1,x2,y2)=>{o+=`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>`;};
const tree=(x,y,r)=>o+=`<circle cx="${X(x)}" cy="${Y(y)}" r="${r*S}" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="${X(x)}" cy="${Y(y)}" r="4" fill="#111"/>`;
const car=(x,y,lab)=>{o+=`<rect x="${X(x)}" y="${Y(y)}" width="${2*S}" height="${4.6*S}" rx="14" fill="none" stroke="#111" stroke-width="1.6"/>`;txt(x+1,y+2.5,lab,15,600,'#111','.08em');};
const dim=(a,b,c,d,lab,off)=>{ // horizontal dimension
  line(a,b,c,d,1,'#777');line(a,b-.3,a,b+.3,1,'#777');line(c,d-.3,c,d+.3,1,'#777');txt((a+c)/2,b-.25,lab,15,400,'#777','.06em');};

o+=`<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111"/></marker></defs>`;

/* ===== HOUSE: one long rectangle 0..42 x 0..18, spa wing 42..52, front (pool side) is y=18 ===== */
// outer walls main block
wall(0,0,42,0); wall(0,0,0,18);
// front: garage glass, wall stub, hall glass, living/dining/kitchen glass
glass(0.5,18,13.5,18); wall(0,18,0.5,18); wall(13.5,18,14,18);
glass(14,18,22,18); glass(22,18,42,18);
// garage block back rooms
iwall(14,0,14,18);                 // garage | hall
iwall(0,6,14,6);                   // garage | back rooms
iwall(5,0,5,6); iwall(9.5,0,9.5,6);
doorV(14,8.5,1.1,'left');          // garage -> hall door (shown on hall wall)
door(1.2,6,1,'up'); door(6,6,1,'up'); door(10.4,6,1,'up');
// hall
iwall(22,0,22,6.5);                // hall | cinema (back)
// back zone: cinema, pantry, coats/WC
iwall(22,7,34,7); iwall(34,0,34,7); iwall(38,0,38,7); iwall(34,7,42,7);
door(23,7,1.1,'down'); door(34.6,7,1,'down'); door(38.6,7,1,'down');
// kitchen back wall run
// spa wing
wall(42,2,52,2); wall(52,2,52,18); wall(42,18,46,18); glass(46,18,52,18); iwall(42,0,42,2);
iwall(42,2,42,18);
iwall(42,7,52,7); iwall(47,2,47,7);
doorV(42,9,1.1,'right'); door(43,7,1,'up'); door(48,7,1,'up');
glass(52,9,52,15);                 // spa doors to garden

// stair in hall: floating stair rising along the back
stair(15,1,6.5,1.6,13,true); arrow(15.4,1.8,21.2,1.8); txt(18.2,3.2,'UP',16,600);
// skylight + olive
rect(15.5,8,5,5,'none','#111',1.4,'10 6'); tree(18,10.5,1.7); txt(18,13.9,'SKYLIGHT · OLIVE',14,500,'#555');
// pivot front door
o+=`<line x1="${X(16)}" y1="${Y(18)}" x2="${X(17.6)}" y2="${Y(16.6)}" stroke="#111" stroke-width="5"/>`;
// fireplace in living (on cinema wall)
rect(24.5,7,4,.6,'#111');
// kitchen island + back run
rect(36.5,7.2,5.3,.9); rect(36.8,11.5,4.6,1.5);
// plunge pool
rect(43.2,9.5,6,5,'none','#111',2); for(let i=0;i<5;i++) line(43.2,10.3+i*.8,43.6,10.3+i*.8,1);
// labels
txt(7,12.4,'GARAGE'); txt(7,13.3,'13 × 12 m',15,400,'#555');
txt(2.5,3.4,'WC',20); txt(7.25,3.4,'UTILITY',20); txt(11.75,3.4,'STORE',20);
txt(18,15.6,'ENTRANCE HALL'); txt(18,16.4,'double height',15,400,'#555');
txt(28,4,'CINEMA'); txt(28,4.9,'8 seats',15,400,'#555');
txt(36,4,'PANTRY',18); txt(40,4,'WC',18);
txt(26.5,13.2,'LIVING'); txt(32.5,13.2,'DINING'); txt(39,15.6,'KITCHEN');
txt(44.5,5,'SAUNA',18); txt(49.5,5,'STEAM',18);
txt(46.2,16.4,'SPA',24); txt(46.2,17.2,'plunge pool',15,400,'#555');

/* ===== OUTSIDE ===== */
// covered terrace under the box (box outline dashed)
rect(12,-0.6,34,20.6,'none','#aaa',1.2,'14 8'); txt(46,21.3,'BOX ABOVE',13,500,'#999');
txt(32,19.3,'COVERED TERRACE',15,500,'#555');
// lit steps up from forecourt
stair(14.2,18.2,4.2,5,6,false); txt(16.3,23.9,'LIT STEPS',15,500,'#555');
// reflecting pool
rect(18.6,20.2,26,5.4,'none','#111',2); txt(26,23.6,'BLACK REFLECTING POOL',16,500,'#555');
rect(28.5,20.8,3.4,3.2); tree(30.2,22.4,1.6); rect(38,20.8,3.2,3.2); tree(39.6,22.4,1.5);
// forecourt + cars
rect(-1,18.6,15,10,'none','#888',1.4,'4 6'); txt(6.5,28,'FORECOURT',16,500,'#555');
car(3.2,20.5,'M3 CS'); car(7.2,20.2,'URUS');
// landscape + road
txt(32,28,'LANDSCAPED TERRACES  ·  GARDEN STEPS  ·  ROAD',15,500,'#888');
// dims
dim(0,-1.9,42,-1.9,'42 m'); dim(42,-1.9,52,-1.9,'10 m');
// title
o+=`<text x="${OX}" y="70" font-size="40" letter-spacing=".3em" font-weight="300">CASA OMBRA — GROUND FLOOR</text>`;
o+=`<text x="${OX}" y="104" font-size="17" letter-spacing=".18em" fill="#666">SKETCH PLAN · NOT TO SCALE · POOL / FRONT AT THE BOTTOM</text>`;
o+=`<g transform="translate(2280,90)"><polygon points="0,-26 9,6 0,0 -9,6" fill="#111"/><text y="28" font-size="16" text-anchor="middle">N</text></g>`;
document.getElementById('s').innerHTML=o;
</script></body></html>
