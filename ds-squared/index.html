<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DS Squared</title>
<meta name="description" content="Unofficial concept by AIV Designs for DS Squared, RIBA Chartered architects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/house-sketch.webp">
<link rel="preload" as="image" href="img/house.webp">
<style>
:root{
  --stone:#F4F1EC; --ink:#1F1C1A; --ink-2:#6A635C; --orange:#EC542D; --white:#fff;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --head:60px; --pad:24px; --ar:1.7704;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--stone);color:var(--ink);font:400 16px/1.5 "Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--orange);color:#fff}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:2px}

/* Header */
.top{position:fixed;inset:0 0 auto 0;height:var(--head);z-index:5;display:flex;align-items:center;gap:32px;padding:0 var(--pad);color:var(--ink);transition:color .6s var(--ease-out)}
.logo{display:block;width:34px;height:34px;flex:none}
.logo img{width:100%;height:100%;display:block}
.nav{display:flex;gap:24px;font-size:14px;font-weight:500}
.nav a,.book-sm{position:relative}
.nav a::after,.book-sm::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease-out)}
.nav a:hover::after,.book-sm:hover::after{transform:scaleX(1)}
.book-sm{margin-left:auto;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.book-sm i{width:7px;height:7px;background:var(--orange);display:block}
.menu{display:none;margin-left:auto;font:600 14px/1 "Hanken Grotesk",system-ui,sans-serif;background:none;border:0;color:inherit;cursor:pointer;padding:8px 0}
.on .top{color:var(--white)}
.panel{position:fixed;inset:var(--head) 0 auto 0;z-index:6;background:var(--stone);color:var(--ink);padding:8px var(--pad) 20px;display:none;flex-direction:column;font-size:20px;font-weight:500}
.panel a{padding:8px 0;border-bottom:1px solid #ddd6cc}
.panel.open{display:flex}

/* The scene: covers the screen like a photo would, keeping the sketch and photo locked together */
.scene{position:fixed;left:50%;top:50%;width:max(100vw,100vh * var(--ar));aspect-ratio:var(--ar);transform:translate(-50%,-50%)}
.scene>*{position:absolute;inset:0;background-size:100% 100%}
.sketch{background-image:url(img/house-sketch.webp);opacity:0;transition:opacity .9s var(--ease-out)}
.go .sketch{opacity:1}
.sweep{position:fixed;inset:0;clip-path:inset(0 100% 0 0)}
.sweep .scene{position:absolute}
.sweep .scene>*{position:absolute;inset:0;background-size:100% 100%}
.photo{background-image:url(img/house.webp)}
.build .sweep{clip-path:inset(0 0 0 0);transition:clip-path 2.6s cubic-bezier(.65,0,.35,1)}
.rule{position:fixed;top:0;bottom:0;left:0;width:2px;background:var(--orange);z-index:3;opacity:0;transform:translateX(-4px);box-shadow:0 0 18px rgba(236,84,45,.35)}
.build .rule{opacity:1;transform:translateX(100vw);transition:transform 2.6s cubic-bezier(.65,0,.35,1),opacity .3s}
.done .rule{opacity:0;transition:opacity .5s}
.shade{background:linear-gradient(180deg,rgba(20,18,16,.35) 0,rgba(20,18,16,0) 20%,rgba(20,18,16,0) 50%,rgba(20,18,16,.6) 100%);opacity:0}
.on .shade{opacity:1;transition:opacity 1s var(--ease-out)}

/* Landing copy, bottom-left */
.copy{position:fixed;left:var(--pad);bottom:var(--pad);right:var(--pad);z-index:4;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;pointer-events:none}
.on .copy>*{pointer-events:auto}
.copy h1{font-weight:500;font-size:clamp(3.5rem,9vw,6rem);line-height:.92;letter-spacing:-.04em}
.copy p{font-size:clamp(1rem,1.3vw,1.125rem);max-width:34ch;margin-top:12px;color:rgba(255,255,255,.9)}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:var(--orange);color:#fff;font-weight:600;font-size:16px;padding:13px 18px;transition:background .25s,transform .25s var(--ease-out)}
.cta:hover{background:#d9461f}.cta:active{transform:scale(.98)}
.cta svg{transition:transform .3s var(--ease-out)}.cta:hover svg{transform:translateX(3px)}
.note{font-size:12px;color:rgba(255,255,255,.75);text-align:right}
.reveal{opacity:0;transform:translateY(18px);filter:blur(6px)}
.on .reveal{opacity:1;transform:none;filter:none;transition:opacity .9s var(--ease-out),transform 1.1s var(--ease-out),filter .9s var(--ease-out);transition-delay:calc(var(--r,0)*110ms)}
.replay{position:fixed;right:var(--pad);top:calc(var(--head) + 8px);z-index:4;background:none;border:0;color:#fff;font:500 12px/1 "Hanken Grotesk",system-ui,sans-serif;opacity:0;cursor:pointer;padding:6px 0}
.on .replay{opacity:.75;transition:opacity .6s .8s}.replay:hover{opacity:1}

@media (max-width:760px){
  :root{--pad:16px;--head:56px}
  .nav,.book-sm{display:none}
  .menu{display:block}
  .copy{flex-direction:column;align-items:flex-start}
  .note{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#" aria-label="DS Squared home"><img src="img/logo.png" alt=""></a>
  <nav class="nav" aria-label="Main">
    <a href="#projects">Projects</a><a href="#about">About</a><a href="#services">What we do</a><a href="#who">Who we help</a><a href="#contact">Contact</a>
  </nav>
  <a class="book-sm" href="https://www.dssquared.co.uk/speak-to-an-expert" target="_blank" rel="noopener"><i></i>Book a consultation</a>
  <button class="menu" aria-expanded="false" aria-controls="panel">Menu</button>
</header>
<nav class="panel" id="panel" aria-label="Main">
  <a href="#projects">Projects</a><a href="#about">About</a><a href="#services">What we do</a><a href="#who">Who we help</a><a href="#contact">Contact</a><a href="https://www.dssquared.co.uk/speak-to-an-expert" target="_blank" rel="noopener">Book a consultation</a>
</nav>

<!-- From sketch to finished house. Photo and sketch: a DS Squared new build, cleaned and drawn with Higgsfield. -->
<div class="scene" role="img" aria-label="An architect's sketch of a brick and white family home turns into the finished house">
  <div class="sketch"></div>
</div>
<!-- the finished house, revealed behind an architect's ruler line -->
<div class="sweep"><div class="scene"><div class="photo"></div><div class="shade"></div></div></div>
<i class="rule" aria-hidden="true"></i>

<section class="copy">
  <div>
    <h1 class="reveal" style="--r:0">DS Squared</h1>
    <p class="reveal" style="--r:1">RIBA Chartered architects for homes, developers and healthcare, from first sketch to finished building.</p>
    <a class="cta reveal" style="--r:2" href="https://www.dssquared.co.uk/speak-to-an-expert" target="_blank" rel="noopener">Book a consultation
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M1 7h11M7.5 2.5 12 7l-4.5 4.5" stroke="currentColor" stroke-width="1.6"/></svg></a>
  </div>
  <p class="note reveal" style="--r:3">Unofficial concept by AIV Designs</p>
</section>
<button class="replay" type="button">Replay</button>

<script>
(() => {
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  function play() {
    timers.forEach(clearTimeout); timers = [];
    root.classList.remove('go', 'build', 'done', 'on');
    void root.offsetWidth;
    if (reduce) { root.classList.add('go', 'build', 'done', 'on'); return; }
    requestAnimationFrame(() => root.classList.add('go'));       // the sketch appears
    at(1400, () => root.classList.add('build'));                  // the ruler sweeps, sketch becomes the house
    at(1400 + 2600, () => root.classList.add('done'));            // ruler fades
    at(1400 + 2900, () => root.classList.add('on'));              // name and button
  }
  // start once both images are ready
  let left = 2;
  for (const src of ['img/house-sketch.webp', 'img/house.webp']) { const im = new Image(); im.onload = im.onerror = () => { if (--left === 0) play(); }; im.src = src; }
  document.querySelector('.replay').addEventListener('click', play);
  const btn = document.querySelector('.menu'), panel = document.getElementById('panel');
  btn.addEventListener('click', () => { const o = panel.classList.toggle('open'); btn.setAttribute('aria-expanded', o); btn.textContent = o ? 'Close' : 'Menu'; });
})();
</script>
</body>
</html>
